<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#3D0C71" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ŞubadApp" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./subadapp-icon.png" />
    <title>ŞubadApp</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      #root {
        display: flex;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          const manifest = document.querySelector('link[rel="manifest"]');
          const serviceWorkerUrl = new URL(
            "service-worker.js",
            manifest.href
          );
          navigator.serviceWorker
            .register(serviceWorkerUrl)
            .catch((error) => {
              console.error(
                "ŞubadApp çevrimdışı desteği etkinleştirilemedi:",
                error
              );
            });
        });
      }
    </script>
  </body>
</html>
